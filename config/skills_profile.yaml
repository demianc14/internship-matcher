# Fuente de verdad de mi perfil. Derivado de "Base CV.tex" (versión 2026-09-21).
#
# Regla (la misma del CV): solo habilidades respaldadas por el CV. No hay niveles
# autoevaluados; el tier sale de DÓNDE aparece la habilidad en el CV:
#   demostrado   = aparece en un bullet de experiencia o proyecto
#   listado      = solo en "Habilidades Técnicas" o respaldado por certificación
#   en_formacion = el propio CV lo marca como "en formación"
# Las claves de `skills` deben existir en config/keyword_vocabulary.yaml
# (el loader falla si no, para que ninguna skill quede sin poder matchear).

cv_path: "~/Documents/Documentos Demi/Base CV.tex"

tier_weights:
  demostrado: 1.0
  listado: 0.6
  en_formacion: 0.3

skills:

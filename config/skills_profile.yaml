# Idiomas hablados. Nivel CEFR; "nativo" cuenta como C2.
languages:
  es: nativo
  en: B2
  it: A1  # "Italiano (básico)" en el CV
# Nivel mínimo para considerar que puedo trabajar en ese idioma.
min_working_level: B2

# Resumen para el componente semántico. Copiado del "Perfil" del CV.
# Temporal: en la Fase 4 los passages salen de los bullets parseados del CV.
summary: >
  Estudiante de Ingeniería en Ciencias de la Computación con Minor en Análisis de
  Datos, enfocado en automatización de procesos, pipelines de datos e IA aplicada.
  Experiencia real en Power Automate y Google Apps Script, y proyectos en Python con
  validación fail-fast, pruebas automatizadas y simulación estadística.

# Reglas de encaje (no afectan el score, dan el veredicto apta / revisar / no_apta).
fit:
  seniority:
    ok: [intern, entry]
    # Werkstudent suele exigir matrícula en una universidad alemana; mid = revisar.
    review: [student_job, mid]
    blocker: [senior]
  home_city: quito
  # Carga horaria buscada: 4–6 h/día. Semanal equivalente solo para comparar
  # vacantes que la dan por semana (documentado: asume 5 días).
  hours_per_day: [4, 6]
  hours_per_week: [20, 30]
  full_time: review
  # Años de experiencia profesional acreditables: la pasantía en el Galápagos Science
  # Center (3 meses). Una vacante que pida MÁS que esto se bloquea — decisión
  # explícita del 2026-09-22: con 98 de 348 vacantes pidiendo años concretos, avisar
  # no alcanzaba (una de 7 años quedaba 3.ª en el ranking).
  max_years_experience: 1

# Pesos del score (0–100). Si un componente no está disponible, se renormaliza
# sobre los que sí, y la explicación lo dice.
score_weights:
  skills: 0.6
  semantic: 0.4
# Denominador mínimo de la cobertura de skills: una vacante que pide 1 skill
# que tengo no demuestra 100% de encaje. cobertura = Σ pesos / max(# pedidas, esto).
min_required_skills: 3
# Calibración del coseno título↔bullets → [0, 1]. Sale de la distribución real
# sobre el snapshot Arbeitnow del 2026-09-21 (249 vacantes): p50 0.33, p90 0.49,
# máx 0.67. Re-calibrar si cambia el modelo o entran fuentes muy distintas.
semantic_calibration:
  low: 0.30
  high: 0.60

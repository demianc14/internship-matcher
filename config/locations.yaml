# Ciudades que el pipeline reconoce en texto libre CUANDO la vacante no trae campo
# de ubicación (caso típico de la fuente manual: pegas el aviso y ya). Si el texto
# menciona dos ciudades distintas, no se elige ninguna: queda sin ubicación.
#
# canónica: [alias...]. Las parroquias/valles del área metropolitana de Quito
# mapean a "Quito" a propósito: para el filtro de "híbrido en Quito" son lo mismo.

cities:
  Quito: [quito, cumbayá, cumbaya, tumbaco, valle de los chillos, san rafael, sangolquí,
          sangolqui, pomasqui, calderón]
  Guayaquil: [guayaquil, samborondón, samborondon, daule]
  Cuenca: [cuenca]
  Ambato: [ambato]
  Manta: [manta]
  Loja: [loja]
  Ibarra: [ibarra]
  Riobamba: [riobamba]
  Portoviejo: [portoviejo]
  Machala: [machala]
  Santo Domingo: [santo domingo de los tsáchilas, santo domingo]

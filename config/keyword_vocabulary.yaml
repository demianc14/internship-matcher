# Vocabulario GENÉRICO de habilidades: lo que el parser del CV y el matcher
# reconocen como keyword, sin importar si la tengo o no. canónico: [alias...]. El match ignora mayúsculas y exige límites
# de palabra, así que "java" no matchea dentro de "javascript". Alias en en/de/es
# porque las vacantes (y el CV) vienen en varios idiomas.
#
# Excluidos a propósito por ambiguos en texto libre: "R" (letra suelta),
# "Go" (verbo), "Excel" como verbo ("excel at") → solo "microsoft excel"/"excel skills".
# Esa exclusión aplica al texto libre. Un ítem de una LISTA de skills que es
# exactamente el nombre canónico o un alias ("Excel") sí se reconoce: ver
# Vocabulary.canonicalize.

keywords:
  # Lenguajes
  python: [python]
  sql: [sql]
  java: [java]
  javascript: [javascript, js]
  typescript: [typescript]
  c++: [c++]
  c#: [c#]
  golang: [golang]
  kotlin: [kotlin]
  scala: [scala]
  matlab: [matlab]
  bash: [bash, shell scripting]

  # Datos / ML
  pandas: [pandas]
  numpy: [numpy]
  scikit-learn: [scikit-learn, sklearn]
  pytorch: [pytorch]
  tensorflow: [tensorflow]
  machine learning: [machine learning, ml, ml engineer, aprendizaje automático]
  deep learning: [deep learning]
  nlp: [nlp, natural language processing]
  statistics: [statistics, statistical, statistik, estadística, estadístico, estadísticos,
               monte carlo]
  data analysis: [data analysis, data analytics, datenanalyse, análisis de datos]
  etl: [etl, elt, data pipeline, data pipelines, pipeline de datos, pipelines de datos]
  spark: [spark, pyspark]
  airflow: [airflow]
  dbt: [dbt]
  llm: [llm, llms, large language model, large language models, generative ai, genai,
        ia generativa]
  # Genérico a propósito: muchos avisos piden "IA" sin más. "ia"/"ai" sueltos
  # respetan límites de palabra, así que no matchean dentro de otras palabras.
  artificial intelligence: [artificial intelligence, inteligencia artificial, ai, ia]
  ai agents: [ai agents, llm agents, agentic ai, agentic systems, ia agéntica, agentes de ia]
  rag: [rag, retrieval-augmented generation, retrieval augmented generation]
  computer vision: [computer vision, visión por computadora, visión artificial]

  # BI / ofimática
  power bi: [power bi, powerbi]
  tableau: [tableau]
  looker: [looker]
  # "excel" suelto no: en inglés es verbo ("excel at"). Alias en español acotados.
  excel: [microsoft excel, ms excel, excel skills, advanced excel, excel avanzado, en excel,
          y excel]

  # Calidad de código
  pydantic: [pydantic]
  pytest: [pytest]
  mypy: [mypy]
  junit: [junit]

  # Automatización. "process automation" agrupa RPA y automatización de procesos:
  # los avisos en español lo dicen de las dos formas ("herramientas de RPA",
  # "automatización con robótica de procesos").
  process automation: [process automation, automatización de procesos,
                       automatizacion de procesos, procesos automatizados, rpa,
                       robotic process automation, robótica de procesos,
                       robotica de procesos]
  low-code: [low-code, low code, lowcode, no-code, no code]
  power automate: [power automate, microsoft power automate]
  google apps script: [google apps script, apps script]

  # Backend / infra
  fastapi: [fastapi]
  spring boot: [spring boot]  # "spring" solo sería ambiguo (estación)
  jinja2: [jinja2, jinja]
  django: [django]
  flask: [flask]
  rest api: [rest api, rest apis, restful, api rest, apis rest]
  apis: [api, apis, web api, web apis]
  databases: [database, databases, base de datos, bases de datos, relational database,
              esquema relacional]
  postgresql: [postgresql, postgres]
  mysql: [mysql]
  mongodb: [mongodb]
  docker: [docker]
  kubernetes: [kubernetes, k8s]
  aws: [aws, amazon web services]
  gcp: [gcp, google cloud]
  azure: [azure]
  git: [git, github, gitlab]
  linux: [linux]
  ci/cd: [ci/cd, continuous integration]

  # Frontend
  html: [html, html5]
  css: [css, css3]
  bootstrap: [bootstrap]
  react: [react, react.js, reactjs]
  node.js: [node.js, nodejs]

  # Negocio / herramientas
  salesforce: [salesforce]
  sap: [sap]
  hubspot: [hubspot]
  jira: [jira]
  crm: [crm, crm software]
  workday: [workday]

  # Idiomas: se reconocen, pero están en non_skills (abajo) y no cuentan como skill.
  # Ruido posible: "German company" también matchea.
  english: [english, englisch, inglés]
  german: [german, deutsch, deutschkenntnisse, alemán]
  spanish: [spanish, spanisch, español]
  french: [french, französisch, francés]
  italian: [italian, italienisch, italiano]

# Términos reconocidos que el matcher NO trata como skill (se piden, pero no son
# algo que un bullet del CV deba demostrar).
non_skills: [english, german, spanish, french, italian]

# Implicaciones: tener la clave demuestra también las skills de la lista. Solo las
# inequívocas (usar MySQL es escribir SQL). Se aplican del lado del CV.
implies:
  # Power Automate ES una plataforma low-code de automatización de procesos (RPA
  # incluido); Apps Script es JavaScript.
  power automate: [process automation, low-code]
  google apps script: [process automation, javascript]
  mysql: [sql, databases]
  postgresql: [sql, databases]
  rest api: [apis]
  spring boot: [java]

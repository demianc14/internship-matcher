<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>internship-matcher — vacantes</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #fff; --ink: #1b1b1a; --muted: #6b6b66; --line: #e2e1dc;
    --apta: #1f7a4d; --apta-bg: #e6f3ec; --revisar: #8a6100; --revisar-bg: #fbf1dc;
    --no-apta: #94423a; --no-apta-bg: #f8e9e7; --accent: #2f5fd0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15161a; --panel: #1d1f24; --ink: #e9e9e6; --muted: #9a9a94; --line: #2e3138;
      --apta: #6fd39b; --apta-bg: #17302a; --revisar: #e5bb6a; --revisar-bg: #322916;
      --no-apta: #eb9b92; --no-apta-bg: #331f1e; --accent: #8fb0ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 24px 16px 64px; }
  header h1 { font-size: 22px; margin: 0 0 4px; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }

  .stats { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
  .stat {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 12px; font-size: 13px;
  }
  .stat b { display: block; font-size: 19px; font-weight: 600; }
  .stat.warn b { color: var(--no-apta); }

  .filtros {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    border-bottom: 1px solid var(--line); padding: 10px 0; margin-bottom: 12px;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  .filtros select, .filtros input {
    font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--panel); color: var(--ink);
  }
  .filtros input[type="search"] { flex: 1; min-width: 160px; }
  /* Los filtros son chips con área clicable amplia: una casilla suelta de 13px
     es incómoda de acertar, sobre todo en móvil. */
  .filtros label {
    font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px;
    padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--panel); cursor: pointer; user-select: none;
  }
  .filtros label:has(:checked) { color: var(--accent); border-color: var(--accent); }
  .filtros input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--accent); margin: 0; }
  #conteo { font-size: 13px; color: var(--muted); margin-left: auto; }

  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 10px;
  }
  .card-head { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .score { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; min-width: 3.2em; }
  .score small { font-size: 12px; font-weight: 400; color: var(--muted); }
  .titulo { font-weight: 600; }
  .titulo a { color: inherit; text-decoration: none; }
  .titulo a:hover { text-decoration: underline; }
  .empresa { color: var(--muted); }
  .pill {
    font-size: 11px; letter-spacing: .04em; text-transform: uppercase; font-weight: 650;
    padding: 2px 8px; border-radius: 99px;
  }
  .apta { color: var(--apta); background: var(--apta-bg); }
  .revisar { color: var(--revisar); background: var(--revisar-bg); }
  .no_apta { color: var(--no-apta); background: var(--no-apta-bg); }

  .meta { margin-top: 6px; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .meta .nd { opacity: .75; font-style: italic; }
  .quito { color: var(--apta); font-weight: 600; }

  .avisos { margin: 8px 0 0; padding: 0; list-style: none; font-size: 13px; }
  .avisos li { margin-top: 3px; }
  .avisos .bloqueo { color: var(--no-apta); }
  .avisos .revision { color: var(--revisar); }
  .avisos .nota { color: var(--muted); }

  details { margin-top: 10px; }
  summary { cursor: pointer; font-size: 13px; color: var(--accent); }
  .detalle { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 10px; font-size: 13.5px; }
  .detalle h4 { margin: 12px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .detalle h4:first-child { margin-top: 0; }
  .skill { display: inline-block; border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; margin: 0 4px 4px 0; }
  .skill.tiene { border-color: var(--apta); color: var(--apta); }
  .skill.falta { border-color: var(--no-apta); color: var(--no-apta); }
  .skill .tier { font-size: 11px; opacity: .8; }
  .evid { color: var(--muted); font-size: 12.5px; margin: 2px 0 0; padding-left: 12px; border-left: 2px solid var(--line); }
  .bullet { margin: 0 0 8px; }
  .bullet .txt { display: block; }
  .bullet .warn { color: var(--revisar); font-size: 12.5px; }
  .vacio { text-align: center; color: var(--muted); padding: 40px 0; }
  footer { margin-top: 32px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Vacantes analizadas</h1>
    <p id="subtitulo"></p>
  </header>

  <section class="stats" id="stats"></section>

  <div class="filtros">
    <select id="f-verdicto">
      <option value="">Todos los veredictos</option>
      <option value="apta">Solo aptas</option>
      <option value="revisar">Solo a revisar</option>
      <option value="viables" selected>Aptas + a revisar</option>
      <option value="no_apta">Solo no aptas</option>
    </select>
    <select id="f-fuente"><option value="">Todas las fuentes</option></select>
    <label><input type="checkbox" id="f-quito"> Solo Quito</label>
    <label>Score ≥ <input type="number" id="f-score" min="0" max="100" step="10" value="0" style="width:4.5em"></label>
    <input type="search" id="f-texto" placeholder="Buscar título, empresa o skill…">
    <span id="conteo"></span>
  </div>

  <main id="lista"></main>

  <footer>
    Generado por <code>python -m src.cli</code>. Score y veredicto son cosas distintas:
    el score mide cuánto encajan tus skills; el veredicto, si puedes tomar el puesto.
    Fuentes: <a href="https://www.arbeitnow.com/">Arbeitnow</a>,
    <a href="https://remoteok.com/">Remote OK</a> y vacantes cargadas a mano.
  </footer>
</div>

<script id="datos" type="application/json">/*__DATOS__*/</script>
<script>
const DATOS = JSON.parse(document.getElementById("datos").textContent);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const ETIQUETAS = {
  remote: "remoto", hybrid: "híbrido", onsite: "presencial",
  intern: "pasantía", student_job: "puesto de estudiante", entry: "junior", mid: "intermedio", senior: "senior",
  full_time: "jornada completa", part_time: "media jornada",
  no_signal: "sin señal", conflict: "señales contradictorias", weak_signal: "señal débil", unknown_value: "valor desconocido",
};
const t = (v) => ETIQUETAS[v] || v;

function campo(nombre, r) {
  if (r.value) return `${nombre}: <b>${t(r.value)}</b>`;
  return `<span class="nd">${nombre}: ${t(r.unresolved)}</span>`;
}

function horas(h) {
  if (h.period) {
    const rango = h.min === h.max ? h.min : `${h.min}–${h.max}`;
    return `horas: <b>${rango} h/${h.period === "day" ? "día" : "semana"}</b>`;
  }
  return `<span class="nd">horas: ${t(h.unresolved)}</span>`;
}

function detalle(v) {
  const s = v.skills, out = [];
  if (s.matched.length || s.missing.length) {
    out.push("<h4>Skills</h4><div>");
    for (const m of s.matched) out.push(`<span class="skill tiene">${esc(m.skill)} <span class="tier">${esc(m.tier)}</span></span>`);
    for (const k of s.missing) out.push(`<span class="skill falta">${esc(k)}</span>`);
    out.push("</div>");
    for (const m of s.matched.slice(0, 3)) out.push(`<p class="evid">${esc(m.skill)}: ${esc(m.evidence)}</p>`);
  }
  if (s.note) out.push(`<p class="evid">${esc(s.note)}</p>`);

  for (const par of (v.semantic.top_pairs || []).slice(0, 2)) {
    out.push(`<p class="evid">≈ ${par.similarity.toFixed(2)} «${esc(par.vacancy_sentence)}» ↔ «${esc(par.profile_passage)}»</p>`);
  }
  for (const nombre of ["modality", "seniority", "schedule"]) {
    const r = v[nombre];
    if (r.evidence) out.push(`<p class="evid">${nombre}: ${esc(r.evidence)}</p>`);
  }
  if (v.hours.evidence) out.push(`<p class="evid">horas: ${esc(v.hours.evidence)}</p>`);
  if (v.location_source === "description") out.push(`<p class="evid">ubicación deducida del texto</p>`);

  const g = v.suggestion;
  if (g) {
    if (g.highlight.length) {
      out.push("<h4>Bullets del CV a destacar</h4>");
      for (const b of g.highlight) {
        out.push(`<p class="bullet"><span class="txt">[${esc(b.bullet_id)}] ${esc(b.text)}</span>`);
        out.push(`<span class="evid">cubre: ${esc(b.covers.join(", ") || "—")}</span>`);
        for (const w of b.warnings) out.push(`<span class="warn">⚠ ${esc(w)}</span>`);
        out.push("</p>");
      }
    }
    if (g.mention.length) {
      out.push("<h4>Nombrar explícitamente</h4>");
      for (const m of g.mention) out.push(`<p class="bullet">${esc(m.skill)} → ${esc(m.where)}<span class="evid">${esc(m.reason)}</span></p>`);
    }
    for (const [seccion, orden] of Object.entries(g.entry_order || {})) {
      out.push(`<h4>Reordenar «${esc(seccion)}»</h4><p>${orden.map((x, i) => `${i + 1}. ${esc(x)}`).join(" · ")}</p>`);
    }
    if (g.drop_optional.length) out.push(`<h4>Se puede quitar</h4><p>${g.drop_optional.map(esc).join(", ")}</p>`);
    if (g.profile_notes.length) out.push(`<h4>Perfil</h4>${g.profile_notes.map((n) => `<p>${esc(n)}</p>`).join("")}`);
    if (g.gaps.length) out.push(`<h4>Brechas reales</h4><p>${g.gaps.map(esc).join(", ")} <span class="evid">no están en tu CV; no agregar sin respaldo</span></p>`);
  }
  return out.join("");
}

function tarjeta(v) {
  const score = v.score === null ? '<span class="nd">n/d</span>' : v.score.toFixed(0);
  const comps = Object.entries(v.score_components).map(([k, x]) => `${k} ${(x * 100).toFixed(0)}`).join(", ");
  const avisos = [
    ...v.fit.blockers.map((b) => `<li class="bloqueo">⛔ ${esc(b)}</li>`),
    ...v.fit.reviews.map((r) => `<li class="revision">⚠ ${esc(r)}</li>`),
    ...v.fit.warnings.map((w) => `<li class="nota">· ${esc(w)}</li>`),
  ].join("");
  return `<article class="card">
    <div class="card-head">
      <span class="score">${score}<small>/100</small></span>
      <span class="pill ${v.fit.verdict}">${esc(v.fit.verdict.replace("_", " "))}</span>
      <span class="titulo"><a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.title)}</a></span>
      ${v.company ? `<span class="empresa">${esc(v.company)}</span>` : ""}
    </div>
    <div class="meta">
      <span>${esc(v.source)}</span>
      <span class="${v.is_quito ? "quito" : ""}">${v.location ? esc(v.location) : '<span class="nd">sin ubicación</span>'}</span>
      <span>${campo("modalidad", v.modality)}</span>
      <span>${campo("nivel", v.seniority)}</span>
      <span>${horas(v.hours)}</span>
      ${v.language ? `<span>idioma: ${esc(v.language)}</span>` : ""}
      ${comps ? `<span>${esc(comps)}</span>` : ""}
    </div>
    <ul class="avisos">${avisos}</ul>
    <details><summary>Ver desglose y sugerencias de CV</summary><div class="detalle">${detalle(v)}</div></details>
  </article>`;
}

function pintarStats() {
  const c = DATOS.calidad, v = c.conteos.source || {}, f = Object.entries(v).map(([k, n]) => `${k} ${n}`).join(" · ");
  const verdictos = DATOS.vacantes.reduce((acc, x) => (acc[x.fit.verdict] = (acc[x.fit.verdict] || 0) + 1, acc), {});
  const quito = DATOS.vacantes.filter((x) => x.is_quito).length;
  $("subtitulo").textContent = `Generado el ${DATOS.generated_at.replace("T", " a las ")} · ${f}`;
  $("stats").innerHTML = [
    `<div class="stat"><b>${c.resultantes}</b>vacantes</div>`,
    `<div class="stat"><b>${verdictos.apta || 0}</b>aptas</div>`,
    `<div class="stat"><b>${verdictos.revisar || 0}</b>a revisar</div>`,
    `<div class="stat"><b>${verdictos.no_apta || 0}</b>no aptas</div>`,
    `<div class="stat ${quito ? "" : "warn"}"><b>${quito}</b>en Quito</div>`,
    `<div class="stat"><b>${c.duplicados}</b>duplicados removidos</div>`,
    `<div class="stat"><b>${c.rechazadas}</b>rechazadas por contrato</div>`,
  ].join("");
  const fuentes = new Set(DATOS.vacantes.map((x) => x.source));
  for (const s of fuentes) $("f-fuente").insertAdjacentHTML("beforeend", `<option value="${esc(s)}">${esc(s)}</option>`);
}

function filtrar() {
  const verdicto = $("f-verdicto").value, fuente = $("f-fuente").value;
  const soloQuito = $("f-quito").checked, minScore = Number($("f-score").value) || 0;
  const texto = $("f-texto").value.trim().toLowerCase();
  const filas = DATOS.vacantes.filter((v) => {
    if (verdicto === "viables" ? v.fit.verdict === "no_apta" : verdicto && v.fit.verdict !== verdicto) return false;
    if (fuente && v.source !== fuente) return false;
    if (soloQuito && !v.is_quito) return false;
    if (minScore && (v.score === null || v.score < minScore)) return false;
    if (texto) {
      const heno = `${v.title} ${v.company || ""} ${v.keywords.join(" ")} ${v.location || ""}`.toLowerCase();
      if (!heno.includes(texto)) return false;
    }
    return true;
  });
  $("conteo").textContent = `${filas.length} de ${DATOS.vacantes.length}`;
  $("lista").innerHTML = filas.length
    ? filas.map(tarjeta).join("")
    : '<p class="vacio">Ninguna vacante pasa estos filtros.</p>';
}

pintarStats();
filtrar();
for (const id of ["f-verdicto", "f-fuente", "f-quito", "f-score", "f-texto"]) {
  $(id).addEventListener(id === "f-texto" ? "input" : "change", filtrar);
}
</script>
</body>
</html>

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "internship-matcher"
version = "0.1.0"
description = "Pipeline ETL de vacantes + matching semántico explicable contra un perfil de habilidades y Base_CV.tex"
readme = "README.md"
requires-python = ">=3.11"
# Las dependencias de runtime se agregan en la fase que las necesita
# (fastapi en Fase 5). Embeddings: extra opcional [semantic].
dependencies = [
    "pydantic>=2.7.0",
    "requests>=2.32.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.2.0", "pytest-cov>=5.0.0", "ruff>=0.4.0", "mypy>=1.10.0", "types-requests>=2.32.0", "types-PyYAML>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cv-matcher"
version = "0.1.0"
description = "Dado un JD pegado a mano, analiza el fit contra Base CV.tex y sugiere ediciones con matching testeable"
readme = "README.md"
requires-python = ">=3.11"
# Las dependencias de runtime se agregan en el paso que las necesita
# Sin dependencias de scraping: el input siempre es un JD pegado a mano.
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "pytest-cov>=5.0.0", "ruff>=0.4.0", "mypy>=1.10.0", "types-PyYAML>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -m 'not llm'"
markers = ["llm: llama al LLM real (o usa su caché); correr con `pytest -m llm`"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true


# pytest importa numpy solo para tipos, y los stubs de numpy usan sintaxis de 3.12+;
# el proyecto declara 3.11, así que no se siguen.
[[tool.mypy.overrides]]
module = ["numpy.*", "google.genai.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
